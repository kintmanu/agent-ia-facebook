name: Agent IA Facebook

on:
  push:
    branches: [ main ]
  schedule:
    # Plusieurs créneaux clés de la journée (Matin 8h, Après-midi 14h, Soir 18h UTC)
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
  # Permet aussi de déclencher manuellement d'un simple clic
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les outils
        run: |
          pip install -r requirements.txt

      - name: Lancer l'agent IA Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py

      - name: Sauvegarder l'historique et la configuration
        run: |
          git config --global user.name "kintmanu"
          git config --global user.email "kintmanu@users.noreply.github.com"
          git add history.txt config.json || true
          git commit -m "Mise à jour historique et config" || true
          git push || true
